<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعرات أحمد اليومية</title>
    <!-- خط العربي Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html2Canvas لميزة مشاركة الشاشة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.78);
            --border-color: rgba(255, 255, 255, 0.15);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            /* تعيين خلفية ثابتة وجميلة لجميع الشاشات وتطبيق التعتيم */
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* كارت الملخص العام */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .goal-setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .goal-setting input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            width: 90px;
            text-align: center;
            font-weight: bold;
        }

        /* شريط التقدم */
        .progress-container {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 30px;
            height: 22px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .stat-box strong {
            font-size: 1.1rem;
        }

        /* الأزرار والتبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        /* النماذج وإدخال البيانات */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.2s;
            margin-top: 5px;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        /* القوائم اليومية */
        .list-container {
            margin-top: 15px;
            max-height: 220px;
            overflow-y: auto;
        }

        .list-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .list-item .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        /* زر مشاركة الشاشة */
        .share-btn-container {
            margin-top: 25px;
            text-align: center;
        }

        .share-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="capture-area">
        <header>
            <h1><i class="fa-solid fa-fire"></i> سعرات أحمد اليومية</h1>
            <p>تتبّع دقيق، ذكي، وسريع لغذائك وتمارينك الرياضية</p>
        </header>

        <!-- الكارت العام والملخص -->
        <div class="card">
            <div class="goal-setting">
                <span><i class="fa-solid fa-bullseye"></i> السعرات المستهدفة:</span>
                <input type="number" id="dailyGoalInput" value="1600" onchange="updateGoal()">
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span>المكتسب</span>
                    <strong id="totalConsumed" style="color: #60a5fa;">0</strong>
                </div>
                <div class="stat-box">
                    <span>المحروق (رياضة)</span>
                    <strong id="totalBurned" style="color: #f43f5e;">0</strong>
                </div>
                <div class="stat-box">
                    <span>الصافي / المتبقي</span>
                    <strong id="netCalories" style="color: #34d399;">1600</strong>
                </div>
            </div>
        </div>

        <!-- أزرار التبديل بين الأكل والرياضة -->
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('food')"><i class="fa-solid fa-utensils"></i> سجل الأكل</div>
            <div class="tab-btn" onclick="switchTab('workout')"><i class="fa-solid fa-dumbbell"></i> التمارين الرياضية</div>
        </div>

        <!-- قسم الأكل -->
        <div id="foodSection" class="section-content active">
            <div class="card">
                <div class="form-group">
                    <label>اختر وجبة جاهزة أو أضف يدوياً:</label>
                    <select id="foodPresetSelect" onchange="fillFoodData()">
                        <option value="">-- اختر طعاماً مخصصاً --</option>
                        <option value="أرز أبيض مطبوخ|130">أرز أبيض (100جم) - 130 سعرة</option>
                        <option value="قهوة بالحليب وسكر|120">قهوة بالحليب ومعلقة سكر (كوب) - 120 سعرة</option>
                        <option value="صدر دجاج مشوي|165">صدر دجاج مشوي (100جم) - 165 سعرة</option>
                        <option value="بيضة مسلوقة|78">بيضة مسلوقة (واحدة) - 78 سعرة</option>
                        <option value="موزة متوسطة|105">موزة متوسطة - 105 سعرة</option>
                        <option value="رغيف عيش بلدي|270">رغيف عيش بلدي - 270 سعرة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اسم الأكل:</label>
                    <input type="text" id="foodName" placeholder="مثال: وجبة غداء، نسكافيه...">
                </div>

                <div class="form-group">
                    <label>عدد السعرات الحرارية:</label>
                    <input type="number" id="foodCalories" placeholder="مثال: 350">
                </div>

                <button class="btn-main" onclick="addFood()"><i class="fa-solid fa-plus"></i> إضافة للأكل اليومي</button>

                <div class="list-container" id="foodList"></div>
            </div>
        </div>

        <!-- قسم التمارين والرياضة -->
        <div id="workoutSection" class="section-content">
            <div class="card">
                <div class="form-group">
                    <label>اختر تمريناً:</label>
                    <select id="workoutSelect">
                        <option value="جرى خفيف|10">جري / كارديو (تقريباً 10 سعرة/دقيقة)</option>
                        <option value="اسكوات|8">تمرين اسكوات (تقريباً 8 سعرة/دقيقة)</option>
                        <option value="تمارين ضغط|7">تمرين ضغط Pushups (تقريباً 7 سعرة/دقيقة)</option>
                        <option value="مشي سريع|5">مشي سريع (تقريباً 5 سعرة/دقيقة)</option>
                        <option value="نط الحبل|12">نط الحبل (تقريباً 12 سعرة/دقيقة)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>المدة (بالدقائق):</label>
                    <input type="number" id="workoutMinutes" placeholder="مثال: 20 دقيقة" value="15">
                </div>

                <button class="btn-main" style="background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);" onclick="addWorkout()"><i class="fa-solid fa-fire-flame-curved"></i> تسجيل التمرين وحساب الحرق</button>

                <div class="list-container" id="workoutList"></div>
            </div>
        </div>

        <!-- زر مشاركة الشاشة -->
        <div class="share-btn-container">
            <button class="share-btn" onclick="shareScreen()"><i class="fa-solid fa-camera-retro"></i> التقاط ومشاركة ملخص اليوم</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://chat-ahmed-cb516-default-rtdb.firebaseio.com/";
        
        function getCurrentDateKey() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const todayKey = getCurrentDateKey();
        const lastSavedDay = localStorage.getItem('ahmed_current_day');

        if (lastSavedDay && lastSavedDay !== todayKey) {
            archiveOldDayData(lastSavedDay);
        }
        localStorage.setItem('ahmed_current_day', todayKey);

        function archiveOldDayData(oldDay) {
            const oldFoods = JSON.parse(localStorage.getItem('ahmed_foods')) || [];
            const oldWorkouts = JSON.parse(localStorage.getItem('ahmed_workouts')) || [];
            if(oldFoods.length > 0 || oldWorkouts.length > 0) {
                const archiveData = { foods: oldFoods, workouts: oldWorkouts };
                fetch(`${FIREBASE_URL}/days/${oldDay}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(archiveData)
                }).then(() => {
                    localStorage.removeItem('ahmed_foods');
                    localStorage.removeItem('ahmed_workouts');
                }).catch(err => console.log('Archive error:', err));
            }
        }

        let dailyGoal = localStorage.getItem('ahmed_goal') ? parseInt(localStorage.getItem('ahmed_goal')) : 1600;
        let foods = JSON.parse(localStorage.getItem('ahmed_foods')) || [];
        let workouts = JSON.parse(localStorage.getItem('ahmed_workouts')) || [];

        document.getElementById('dailyGoalInput').value = dailyGoal;

        function updateGoal() {
            const val = parseInt(document.getElementById('dailyGoalInput').value);
            if(val > 0) {
                dailyGoal = val;
                localStorage.setItem('ahmed_goal', dailyGoal);
                updateUI();
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));

            if(tab === 'food') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('foodSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('workoutSection').classList.add('active');
            }
        }

        function fillFoodData() {
            const select = document.getElementById('foodPresetSelect');
            if(!select.value) return;
            const parts = select.value.split('|');
            document.getElementById('foodName').value = parts[0];
            document.getElementById('foodCalories').value = parts[1];
        }

        function syncToFirebase() {
            const currentData = { foods, workouts, goal: dailyGoal };
            fetch(`${FIREBASE_URL}/current_day/${todayKey}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentData)
            }).catch(err => console.log('Sync error:', err));
        }

        function addFood() {
            const name = document.getElementById('foodName').value.trim();
            const calories = parseInt(document.getElementById('foodCalories').value);

            if(!name || isNaN(calories) || calories <= 0) {
                alert('من فضلك ادخل اسم الطعام والسعرات بشكل صحيح.');
                return;
            }

            foods.push({ id: Date.now(), name, calories });
            localStorage.setItem('ahmed_foods', JSON.stringify(foods));
            syncToFirebase();

            document.getElementById('foodName').value = '';
            document.getElementById('foodCalories').value = '';
            document.getElementById('foodPresetSelect').value = '';
            updateUI();
        }

        function deleteFood(id) {
            foods = foods.filter(item => item.id !== id);
            localStorage.setItem('ahmed_foods', JSON.stringify(foods));
            syncToFirebase();
            updateUI();
        }

        function addWorkout() {
            const select = document.getElementById('workoutSelect');
            const selectedOption = select.options[select.selectedIndex].text.split('(')[0].trim();
            const ratePerMin = parseInt(select.value);
            const minutes = parseInt(document.getElementById('workoutMinutes').value);

            if(isNaN(minutes) || minutes <= 0) {
                alert('من فضلك ادخل عدد الدقائق بشكل صحيح.');
                return;
            }

            const burnedCalories = ratePerMin * minutes;
            workouts.push({ id: Date.now(), name: selectedOption, minutes, burnedCalories });
            localStorage.setItem('ahmed_workouts', JSON.stringify(workouts));
            syncToFirebase();

            updateUI();
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(item => item.id !== id);
            localStorage.setItem('ahmed_workouts', JSON.stringify(workouts));
            syncToFirebase();
            updateUI();
        }

        function updateUI() {
            const totalConsumed = foods.reduce((sum, item) => sum + item.calories, 0);
            const totalBurned = workouts.reduce((sum, item) => sum + item.burnedCalories, 0);
            const netCalories = dailyGoal - totalConsumed + totalBurned;

            document.getElementById('totalConsumed').innerText = totalConsumed;
            document.getElementById('totalBurned').innerText = totalBurned;
            document.getElementById('netCalories').innerText = netCalories;

            let percentage = (totalConsumed / dailyGoal) * 100;
            if(percentage > 100) percentage = 100;
            document.getElementById('progressBar').style.width = percentage + '%';

            const foodListEl = document.getElementById('foodList');
            foodListEl.innerHTML = foods.length === 0 ? '<p style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 10px;">لا يوجد أكل مسجل اليوم</p>' : '';
            foods.slice().reverse().forEach(item => {
                foodListEl.innerHTML += `
                    <div class="list-item">
                        <span><strong>${item.name}</strong> (${item.calories} سعرة)</span>
                        <button class="delete-btn" onclick="deleteFood(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });

            const workoutListEl = document.getElementById('workoutList');
            workoutListEl.innerHTML = workouts.length === 0 ? '<p style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 10px;">لا توجد تمارين مسجلة اليوم</p>' : '';
            workouts.slice().reverse().forEach(item => {
                workoutListEl.innerHTML += `
                    <div class="list-item">
                        <span><strong>${item.name}</strong> (${item.minutes} دقيقة - حرق ${item.burnedCalories} سعرة)</span>
                        <button class="delete-btn" onclick="deleteWorkout(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });
        }

        function shareScreen() {
            const captureElement = document.getElementById('capture-area');
            html2canvas(captureElement, {
                backgroundColor: '#0f172a',
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'سعرات_أحمد_اليومية.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        updateUI();
        syncToFirebase();
    </script>
</body>
</html>
